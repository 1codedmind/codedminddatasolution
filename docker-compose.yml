# Local development infrastructure.
#   docker compose up -d
# Then set in .env.local:
#   DATABASE_URL=postgres://codedmind:codedmind@localhost:5432/codedmind
#   DATABASE_DRIVER=local
services:
  postgres:
    image: postgres:16-alpine
    container_name: codedmind-postgres
    environment:
      POSTGRES_USER: codedmind
      POSTGRES_PASSWORD: codedmind
      POSTGRES_DB: codedmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codedmind"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
